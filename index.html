<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>SYREX Key Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background: #000000;
            padding: 24px;
            color: #ffffff;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
            padding: 28px;
            background: #0a0a0a;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
        }

        .header h1 {
            font-size: 2.2em;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        .header p {
            color: #666;
            font-size: 0.9em;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .stat-label {
            color: #666;
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
            display: block;
        }

        .stat-value {
            font-size: 2.2em;
            font-weight: bold;
            color: #667eea;
        }

        .tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 24px;
            background: #0a0a0a;
            padding: 6px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
        }

        .tab-btn {
            flex: 1;
            padding: 14px;
            background: transparent;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            color: #888;
            transition: all 0.2s;
        }

        .tab-btn:hover {
            background: #1a1a1a;
            color: #ccc;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card {
            background: #0a0a0a;
            border: 1px solid #1a1a1a;
            border-radius: 12px;
            padding: 24px;
        }

        .card-title {
            font-size: 1.1em;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title span {
            background: linear-gradient(135deg, #667eea, #764ba2);
            width: 30px;
            height: 30px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9em;
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 24px;
        }

        .plan-btn {
            background: #0f0f0f;
            border: 1px solid #1f1f1f;
            padding: 14px 8px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            color: #ccc;
            text-align: center;
            transition: all 0.2s;
        }

        .plan-btn:hover {
            border-color: #667eea;
            background: #1a1a1a;
        }

        .plan-btn.selected {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
        }

        .quantity-section {
            background: #0f0f0f;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #1a1a1a;
        }

        .quantity-label {
            color: #888;
            font-size: 0.8em;
            display: block;
            margin-bottom: 10px;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            gap: 12px;
            justify-content: center;
        }

        .quantity-btn {
            width: 44px;
            height: 44px;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 20px;
            cursor: pointer;
            color: white;
        }

        .quantity-btn:hover {
            background: #1a1a1a;
            border-color: #667eea;
        }

        .quantity-input {
            width: 80px;
            height: 44px;
            text-align: center;
            font-size: 18px;
            font-weight: 600;
            background: #0a0a0a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: white;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            color: #888;
            font-size: 0.8em;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;
            background: #0f0f0f;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            color: white;
            font-size: 14px;
        }

        .input-group input:focus {
            outline: none;
            border-color: #667eea;
            background: #1a1a1a;
        }

        .selected-plan {
            background: #0f0f0f;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            padding: 12px;
            margin: 20px 0;
            text-align: center;
            color: #667eea;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
        }

        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            background: #0f0f0f;
            padding: 6px;
            border-radius: 10px;
            border: 1px solid #1a1a1a;
        }

        .filter-btn {
            flex: 1;
            padding: 10px;
            background: transparent;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            color: #888;
        }

        .filter-btn:hover {
            background: #1a1a1a;
            color: #ccc;
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
        }

        .search-box {
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding: 12px 14px;
            background: #0f0f0f;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            color: white;
            font-size: 13px;
        }

        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }

        .keys-list {
            max-height: 500px;
            overflow-y: auto;
        }

        .keys-list::-webkit-scrollbar {
            width: 5px;
        }

        .keys-list::-webkit-scrollbar-track {
            background: #0f0f0f;
            border-radius: 10px;
        }

        .keys-list::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 10px;
        }

        .key-item {
            background: #0f0f0f;
            border: 1px solid #1a1a1a;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
        }

        .key-item:hover {
            border-color: #2a2a2a;
        }

        .key-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }

        .key-code {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            font-weight: bold;
            color: #667eea;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: bold;
        }

        .badge-active {
            background: #1a3a2a;
            color: #4caf50;
        }

        .badge-available {
            background: #1a2a4a;
            color: #667eea;
        }

        .badge-expired {
            background: #3a1a1a;
            color: #f5576c;
        }

        .key-details {
            font-size: 11px;
            color: #666;
            margin-bottom: 8px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
        }

        .key-details span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .date-info {
            color: #888;
            font-size: 10px;
            margin-top: 4px;
        }

        .key-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 8px;
        }

        .action-btn {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            cursor: pointer;
            color: #ccc;
        }

        .action-btn:hover {
            background: #252525;
            border-color: #667eea;
        }

        .reset-btn {
            background: #2a1a0a;
            border-color: #ff9800;
            color: #ff9800;
        }

        .reset-btn:hover {
            background: #3a2a1a;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #444;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1a1a;
            border: 1px solid #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            z-index: 1000;
            font-size: 12px;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        .clear-expired-btn {
            background: linear-gradient(135deg, #2a1a1a, #3a1a1a);
            border: 1px solid #f5576c;
            color: #f5576c;
            margin-top: 16px;
        }

        .clear-expired-btn:hover {
            background: linear-gradient(135deg, #3a1a1a, #4a1a1a);
        }

        @media (max-width: 700px) {
            .plans-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .tabs {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SYREX Key Generator</h1>
            <p>Sistema de gerenciamento de licenças</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><span class="stat-label">Total</span><span class="stat-value" id="totalKeys">0</span></div>
            <div class="stat-card"><span class="stat-label">Disponiveis</span><span class="stat-value" id="availableKeys">0</span></div>
            <div class="stat-card"><span class="stat-label">Ativas</span><span class="stat-value" id="activeKeys">0</span></div>
            <div class="stat-card"><span class="stat-label">Expiradas</span><span class="stat-value" id="expiredKeys">0</span></div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" data-tab="gerar">GERAR KEY</button>
            <button class="tab-btn" data-tab="listar">MINHAS KEYS</button>
        </div>

        <div class="panel active" id="panel-gerar">
            <div class="card">
                <div class="card-title"><span>⚡</span> Gerar Licença</div>
                
                <div class="plans-grid">
                    <button class="plan-btn" data-nome="1 Hora" data-horas="1">1 Hora</button>
                    <button class="plan-btn" data-nome="1 Dia" data-horas="24">1 Dia</button>
                    <button class="plan-btn" data-nome="3 Dias" data-horas="72">3 Dias</button>
                    <button class="plan-btn" data-nome="7 Dias" data-horas="168">7 Dias</button>
                    <button class="plan-btn" data-nome="30 Dias" data-horas="720">30 Dias</button>
                    <button class="plan-btn" data-nome="Lifetime" data-horas="0">Lifetime</button>
                </div>

                <div class="quantity-section">
                    <span class="quantity-label">Quantidade</span>
                    <div class="quantity-control">
                        <button class="quantity-btn" id="btnMenos">-</button>
                        <input type="text" id="quantidade" class="quantity-input" value="1">
                        <button class="quantity-btn" id="btnMais">+</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Nome do Cliente</label>
                    <input type="text" id="customerName" placeholder="Ex: João Silva">
                </div>

                <div id="selectedPlan" class="selected-plan" style="display: none;"></div>
                
                <button class="btn btn-primary" id="btnGerar">GERAR KEY</button>
            </div>
        </div>

        <div class="panel" id="panel-listar">
            <div class="card">
                <div class="card-title"><span>📋</span> Licenças</div>
                
                <div class="filter-bar">
                    <button class="filter-btn" data-filter="all" id="filterAll">Todos</button>
                    <button class="filter-btn" data-filter="available" id="filterAvailable">Disponíveis</button>
                    <button class="filter-btn" data-filter="active" id="filterActive">Ativadas</button>
                    <button class="filter-btn" data-filter="expired" id="filterExpired">Expiradas</button>
                </div>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Buscar por key ou cliente...">
                </div>

                <div class="keys-list" id="keysList">
                    <div class="empty-state">Carregando...</div>
                </div>

                <button class="btn clear-expired-btn" id="btnLimparExpiradas">LIMPAR TODAS EXPIRADAS</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://surtndjzzpyvozrxfmxr.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InN1cnRuZGp6enB5dm96cnhmbXhyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NjQwOTIsImV4cCI6MjA5MDU0MDA5Mn0.g_4ahOx5O_8UNuPshoI248fl_iXm8r7nk9rpfztKCRk';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        
        let todasKeys = [];
        let planoAtual = null;
        let filtroAtual = 'all';
        
        function mostrarToast(msg) {
            let toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerText = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2500);
        }
        
        function gerarKeyCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let result = 'SYREX-';
            for (let i = 0; i < 3; i++) {
                for (let j = 0; j < 5; j++) {
                    result += chars.charAt(Math.floor(Math.random() * chars.length));
                }
                if (i < 2) result += '-';
            }
            return result;
        }
        
        function isKeyExpirada(key) {
            if (key.lifetime) return false;
            if (key.status !== 'active') return false;
            if (!key.expires_at) return false;
            const expira = new Date(key.expires_at);
            const agora = new Date();
            return expira < agora;
        }
        
        function getStatusKey(key) {
            if (isKeyExpirada(key)) return 'expired';
            if (key.status === 'active') return 'active';
            return 'available';
        }
        
        function formatarData(data) {
            if (!data) return null;
            const d = new Date(data);
            return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
        }
        
        function atualizarStats() {
            let total = todasKeys.length;
            let disponiveis = 0;
            let ativas = 0;
            let expiradas = 0;
            
            for (let k of todasKeys) {
                if (isKeyExpirada(k)) expiradas++;
                else if (k.status === 'active') ativas++;
                else if (k.status === 'available') disponiveis++;
            }
            
            document.getElementById('totalKeys').innerText = total;
            document.getElementById('availableKeys').innerText = disponiveis;
            document.getElementById('activeKeys').innerText = ativas;
            document.getElementById('expiredKeys').innerText = expiradas;
        }
        
        async function carregarKeys() {
            const container = document.getElementById('keysList');
            container.innerHTML = '<div class="empty-state">Carregando...</div>';
            
            try {
                const { data, error } = await supabaseClient
                    .from('licenses')
                    .select('*')
                    .order('created_at', { ascending: false });
                
                if (error) throw error;
                
                todasKeys = data || [];
                atualizarStats();
                renderizarKeys();
            } catch (error) {
                container.innerHTML = '<div class="empty-state">Erro: ' + error.message + '</div>';
            }
        }
        
        function renderizarKeys() {
            const busca = document.getElementById('searchInput').value.toLowerCase();
            
            let filtradas = todasKeys.filter(k => {
                const matchBusca = k.key_code.toLowerCase().includes(busca) || 
                    (k.customer_name && k.customer_name.toLowerCase().includes(busca));
                if (!matchBusca) return false;
                
                const status = getStatusKey(k);
                if (filtroAtual === 'all') return true;
                if (filtroAtual === 'available') return status === 'available';
                if (filtroAtual === 'active') return status === 'active';
                if (filtroAtual === 'expired') return status === 'expired';
                return true;
            });
            
            const container = document.getElementById('keysList');
            if (filtradas.length === 0) {
                container.innerHTML = '<div class="empty-state">Nenhuma key encontrada</div>';
                return;
            }
            
            let html = '';
            for (let k of filtradas) {
                let badge = '';
                let status = getStatusKey(k);
                
                if (status === 'expired') badge = '<span class="badge badge-expired">Expirada</span>';
                else if (status === 'active') badge = '<span class="badge badge-active">Ativada</span>';
                else badge = '<span class="badge badge-available">Disponivel</span>';
                
                const hwidText = k.hwid ? 'HWID: ' + k.hwid.substring(0, 16) + '...' : 'HWID: Nao vinculado';
                
                html += '<div class="key-item">';
                html += '<div class="key-header">';
                html += '<span class="key-code">' + k.key_code + '</span>';
                html += badge;
                html += '</div>';
                html += '<div class="key-details">';
                html += '<span>Cliente: ' + (k.customer_name || 'Cliente') + '</span>';
                html += '<span>' + hwidText + '</span>';
                html += '</div>';
                
                // CORREÇÃO: Exibir datas sem mostrar Lifetime indevidamente
                if (status === 'active') {
                    const ativadoEm = formatarData(k.activated_at);
                    if (ativadoEm) {
                        // Só mostra Lifetime se realmente for lifetime (k.lifetime === true)
                        if (k.lifetime === true) {
                            html += '<div class="date-info">✅ Ativada em: ' + ativadoEm + ' | ♾️ Lifetime</div>';
                        } 
                        // Se tem data de expiração
                        else if (k.expires_at) {
                            const expiraEm = formatarData(k.expires_at);
                            html += '<div class="date-info">✅ Ativada em: ' + ativadoEm + ' | ⏰ Expira: ' + expiraEm + '</div>';
                        } 
                        // Se não tem expiração e não é lifetime, mostra só ativação
                        else {
                            html += '<div class="date-info">✅ Ativada em: ' + ativadoEm + '</div>';
                        }
                    }
                } else if (status === 'expired' && k.expires_at) {
                    const expirouEm = formatarData(k.expires_at);
                    html += '<div class="date-info">⏰ Expirada em: ' + expirouEm + '</div>';
                } else if (status === 'available') {
                    html += '<div class="date-info">📦 Aguardando ativação</div>';
                }
                
                const mostrarReset = (status === 'active');
                
                html += '<div class="key-actions">';
                html += '<button class="action-btn" onclick="copiarKey(\'' + k.key_code + '\')">Copiar</button>';
                html += '<button class="action-btn" onclick="deletarKey(\'' + k.id + '\')">Deletar</button>';
                if (mostrarReset) {
                    html += '<button class="action-btn reset-btn" onclick="resetarHWID(\'' + k.id + '\')">Reset HWID</button>';
                }
                html += '</div></div>';
            }
            container.innerHTML = html;
        }
        
        window.copiarKey = async function(key) {
            try {
                await navigator.clipboard.writeText(key);
                mostrarToast('Key copiada!');
            } catch(e) {
                let textarea = document.createElement('textarea');
                textarea.value = key;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                mostrarToast('Key copiada!');
            }
        };
        
        window.deletarKey = async function(id) {
            if (!confirm('Deletar esta key?')) return;
            const { error } = await supabaseClient.from('licenses').delete().eq('id', id);
            if (error) mostrarToast('Erro ao deletar');
            else { mostrarToast('Key deletada!'); carregarKeys(); }
        };
        
        window.resetarHWID = async function(id) {
            if (!confirm('Resetar HWID?')) return;
            const { error } = await supabaseClient.from('licenses').update({ hwid: null, status: 'available', activated_at: null, expires_at: null }).eq('id', id);
            if (error) mostrarToast('Erro ao resetar');
            else { mostrarToast('HWID resetado!'); carregarKeys(); }
        };
        
        async function limparTodasExpiradas() {
            let expiradas = todasKeys.filter(k => isKeyExpirada(k));
            if (expiradas.length === 0) { 
                mostrarToast('Nao ha keys expiradas para limpar'); 
                return; 
            }
            if (!confirm('Deletar TODAS as ' + expiradas.length + ' keys expiradas?')) return;
            
            let deletadas = 0;
            for (let k of expiradas) {
                const { error } = await supabaseClient.from('licenses').delete().eq('id', k.id);
                if (!error) deletadas++;
            }
            mostrarToast(deletadas + ' keys expiradas removidas');
            carregarKeys();
        }
        
        function selecionarPlano(btn, nome, horas) {
            document.querySelectorAll('.plan-btn').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            planoAtual = { nome: nome, horas: horas, lifetime: (horas === 0) };
            document.getElementById('selectedPlan').style.display = 'block';
            document.getElementById('selectedPlan').innerHTML = 'Plano selecionado: ' + nome;
        }
        
        async function gerarKey() {
            if (!planoAtual) { mostrarToast('Selecione um plano'); return; }
            
            let cliente = document.getElementById('customerName').value.trim();
            if (cliente === '') cliente = 'Cliente';
            let qtd = parseInt(document.getElementById('quantidade').value) || 1;
            
            mostrarToast('Gerando ' + qtd + ' key(s)...');
            
            let sucessos = 0;
            for (let i = 0; i < qtd; i++) {
                let keyCode = gerarKeyCode();
                let nomeCliente = qtd === 1 ? cliente : cliente + ' ' + (i+1);
                
                let durationDays = null;
                if (!planoAtual.lifetime && planoAtual.nome !== '1 Hora') {
                    durationDays = planoAtual.horas / 24;
                }
                
                const { error } = await supabaseClient.from('licenses').insert({
                    key_code: keyCode,
                    customer_name: nomeCliente,
                    status: 'available',
                    max_activations: 1,
                    duration_days: durationDays,
                    lifetime: planoAtual.lifetime,
                    notes: 'Plano: ' + planoAtual.nome,
                    expires_at: null
                });
                
                if (!error) sucessos++;
            }
            
            mostrarToast(sucessos + '/' + qtd + ' keys geradas!');
            document.getElementById('customerName').value = '';
            carregarKeys();
        }
        
        function mudarAba(abaId) {
            document.querySelectorAll('.panel').forEach(panel => {
                panel.classList.remove('active');
            });
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            document.getElementById('panel-' + abaId).classList.add('active');
            document.querySelector(`[data-tab="${abaId}"]`).classList.add('active');
        }
        
        function setFiltro(filtro) {
            filtroAtual = filtro;
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.getAttribute('data-filter') === filtro) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            renderizarKeys();
        }
        
        document.getElementById('btnGerar').onclick = gerarKey;
        document.getElementById('btnLimparExpiradas').onclick = limparTodasExpiradas;
        document.getElementById('btnMenos').onclick = () => {
            let q = parseInt(document.getElementById('quantidade').value);
            if (q > 1) document.getElementById('quantidade').value = q - 1;
        };
        document.getElementById('btnMais').onclick = () => {
            let q = parseInt(document.getElementById('quantidade').value);
            if (q < 50) document.getElementById('quantidade').value = q + 1;
        };
        document.getElementById('searchInput').oninput = renderizarKeys;
        
        document.getElementById('filterAll').onclick = () => setFiltro('all');
        document.getElementById('filterAvailable').onclick = () => setFiltro('available');
        document.getElementById('filterActive').onclick = () => setFiltro('active');
        document.getElementById('filterExpired').onclick = () => setFiltro('expired');
        
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.onclick = () => mudarAba(btn.getAttribute('data-tab'));
        });
        
        document.querySelectorAll('.plan-btn').forEach(btn => {
            btn.onclick = () => {
                let nome = btn.getAttribute('data-nome');
                let horas = parseInt(btn.getAttribute('data-horas'));
                selecionarPlano(btn, nome, horas);
            };
        });
        
        carregarKeys();
    </script>
</body>
</html>
